<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCHL Auction Manager</title>
    <link rel="icon" type="image/gif" href="/fchl_logos/0.gif">
    <!-- Vendored, not CDN: every panel and every Assign is an htmx request, so a
         network blip mid-auction wouldn't degrade the cockpit, it would kill it.
         Provenance and upgrade steps in static/vendor/README.md. -->
    <script src="/static/vendor/htmx-1.9.10.min.js"></script>
    <link href="/static/vendor/daisyui-4.12.14.full.min.css" rel="stylesheet" type="text/css" />
    <script src="/static/vendor/tailwindcss-play-3.4.17.js"></script>
    <style>
    /* Bump root font 16 → 18px so all rem-based sizes scale up ~12.5%. */
    html { font-size: 18px; }
    /* Tokyo Night DaisyUI theme — oklch color space (DaisyUI v4 requirement) */
    [data-theme="tokyo-night"] {
        color-scheme: dark;
        --b1: 22.63% 0.0214 280.49;    /* tn-bg #1a1b26 — base background */
        --b2: 28.19% 0.0355 274.75;    /* tn-panel #24283b — panels/cards */
        --b3: 30.56% 0.0369 273.23;    /* tn-hover #292e42 — hover/borders */
        --bc: 84.56% 0.0611 274.76;    /* tn-text #c0caf5 — base content text */
        --p: 71.90% 0.1322 264.20;     /* tn-blue #7aa2f7 — primary (accent) */
        --pc: 22.63% 0.0214 280.49;    /* tn-bg — dark text on primary */
        --s: 82.00% 0.1051 235.72;     /* tn-cyan #7dcfff — secondary */
        --sc: 22.63% 0.0214 280.49;    /* tn-bg — dark text on secondary */
        --a: 78.39% 0.1057 75.43;      /* tn-yellow #e0af68 — accent (yellow) */
        --ac: 22.63% 0.0214 280.49;    /* tn-bg — dark text on accent */
        --n: 40.94% 0.0546 274.27;     /* tn-border #414868 — neutral */
        --nc: 76.66% 0.0537 275.49;    /* tn-fg #a9b1d6 — neutral content */
        --su: 79.53% 0.1395 130.14;    /* tn-green #9ece6a — success */
        --suc: 22.63% 0.0214 280.49;   /* tn-bg */
        --wa: 78.39% 0.1057 75.43;     /* tn-yellow #e0af68 — warning */
        --wac: 22.63% 0.0214 280.49;   /* tn-bg */
        --er: 72.27% 0.1589 10.28;     /* tn-red #f7768e — error */
        --erc: 22.63% 0.0214 280.49;   /* tn-bg — dark text on red (TN red is light enough) */
        --in: 71.90% 0.1322 264.20;    /* tn-blue #7aa2f7 — info */
        --inc: 22.63% 0.0214 280.49;   /* tn-bg */
        --rounded-btn: 0.25rem;
        --rounded-box: 0.375rem;
        --border-btn: 1px;
    }
    </style>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="navbar bg-base-200 border-b border-base-300 px-4 sticky top-0 z-50 min-h-0 h-10">
        <div class="flex-1 gap-2">
            <img src="/fchl_logos/0.gif" alt="FCHL" class="w-7 h-7">
            <span class="text-base font-bold text-primary">FCHL Auction Manager</span>
        </div>
        <div class="flex-none gap-2">
            <button hx-post="/undo" hx-target="#app" hx-swap="innerHTML" class="btn btn-xs btn-outline btn-info" title="Undo (Ctrl+Z)">
                ↩ Undo
            </button>
            <select class="select select-xs select-bordered bg-base-300"
                    hx-post="/load-scenario" hx-target="#app" hx-swap="innerHTML"
                    hx-confirm="Load this scenario? Current auction state will be replaced."
                    hx-trigger="change" name="name"
                    hx-on::after-request="this.selectedIndex=0"
                    title="Load test scenario">
                <option value="" disabled selected>Scenario...</option>
                <option value="goalie-asymmetry">Goalie asymmetry (others have 2G, BOT has 1)</option>
            </select>
            <button hx-post="/reset" hx-target="#app" hx-swap="innerHTML" hx-confirm="Reset to fresh state from CSV? All auction progress will be lost." class="btn btn-xs btn-outline btn-error" title="Reset to fresh state">
                Reset
            </button>
        </div>
    </div>
    <div id="toast-container" class="toast toast-top toast-end z-50"></div>
    <main id="app">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/shortcuts.js"></script>
</body>
</html>
